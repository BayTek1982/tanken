<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1118">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tanken">
<title>Bayazit Tanken</title>
<style>
  :root{
    --bg:#0b1118; --card:#131c26; --card2:#1a2531; --text:#e9eef4; --muted:#8696a7;
    --line:rgba(255,255,255,.07); --accent:#22c55e; --blue:#3b82f6; --blue2:#6366f1;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;
    background:radial-gradient(1200px 500px at 50% -200px, rgba(59,130,246,.14), transparent 70%), var(--bg);min-height:100vh}
  header{position:sticky;top:0;z-index:5;background:rgba(11,17,24,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px 14px 12px;border-bottom:1px solid var(--line)}
  .wrap{max-width:700px;margin:0 auto}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:20px;
    background:linear-gradient(135deg,#3b82f6,#6366f1);box-shadow:0 4px 14px rgba(59,130,246,.35)}
  h1{font-size:19px;margin:0;letter-spacing:.2px}
  .loc{font-size:12.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
  .iconbtn{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:11px;width:40px;height:40px;font-size:17px;cursor:pointer;transition:background .2s}
  .iconbtn:active{background:var(--card2)}
  .iconbtn.spinning{animation:r 1s linear infinite}
  .seg{display:flex;background:var(--card);border-radius:13px;padding:4px;margin-top:12px;border:1px solid var(--line);position:relative}
  .seg button{flex:1;background:none;border:0;color:var(--muted);padding:9px 4px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .25s}
  .seg button.on{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 3px 10px rgba(59,130,246,.3)}
  .row{display:flex;gap:8px;margin-top:9px}
  select,input{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px;font-size:14px;width:100%;outline:none}
  select:focus,input:focus{border-color:rgba(59,130,246,.6)}
  main{padding:14px 14px 40px}
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .sbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 6px;text-align:center}
  .sbox b{display:block;font-size:18px;margin-top:3px;font-variant-numeric:tabular-nums}
  .sbox small{color:var(--muted);font-size:11px;letter-spacing:.3px}
  .count{color:var(--muted);font-size:12px;margin:0 2px 10px}
  .st{background:linear-gradient(180deg,var(--card),#111922);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center;
    animation:fade .35s ease both}
  .st.best{border-color:rgba(34,197,94,.55);box-shadow:0 0 0 1px rgba(34,197,94,.25) inset,0 6px 20px rgba(34,197,94,.08)}
  .st.closed{opacity:.45}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .st.closed{animation-name:fadeC}
  @keyframes fadeC{from{opacity:0}to{opacity:.45}}
  .price{min-width:94px;text-align:center;border-radius:12px;padding:9px 4px;font-weight:800;font-size:25px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .price sup{font-size:13px;vertical-align:top;position:relative;top:3px;margin-left:1px}
  .p-good{background:linear-gradient(135deg,rgba(34,197,94,.2),rgba(34,197,94,.08));color:#4ade80}
  .p-mid{background:linear-gradient(135deg,rgba(245,158,11,.2),rgba(245,158,11,.08));color:#fbbf24}
  .p-bad{background:linear-gradient(135deg,rgba(239,68,68,.2),rgba(239,68,68,.08));color:#f87171}
  .p-none{background:var(--card2);color:var(--muted);font-size:15px}
  .info{flex:1;min-width:0}
  .name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .addr{color:var(--muted);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .tag{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--card2);color:var(--muted)}
  .tag.open{color:#4ade80;background:rgba(34,197,94,.1)}.tag.zu{color:#f87171;background:rgba(239,68,68,.1)}
  .tag.best{background:var(--accent);color:#04210f;font-weight:700}
  .tag.diff{color:#fbbf24}
  .others{font-size:12px;color:var(--muted);margin-top:6px}
  .nav{display:flex;flex-direction:column;gap:6px}
  .nav a,.nav button{background:var(--card2);border:1px solid var(--line);color:var(--text);text-decoration:none;border-radius:11px;width:42px;height:40px;display:grid;place-items:center;font-size:17px;cursor:pointer}
  .nav button.fav{color:#fbbf24}
  .msg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center;color:var(--muted);line-height:1.55}
  .msg b{color:var(--text)}
  .bar{height:4px;background:var(--card2);border-radius:4px;overflow:hidden;margin:12px auto 0;max-width:220px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue2));transition:width .3s}
  .btn{display:inline-block;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:0;border-radius:11px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px;text-decoration:none}
  .btn.grey{background:var(--card2);border:1px solid var(--line)}
  footer{color:var(--muted);font-size:11px;text-align:center;margin-top:20px;line-height:1.6}
  footer a{color:var(--muted)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .overlay.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px 28px;border-top:1px solid var(--line);animation:up .25s ease}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .sheet h2{margin:0 0 10px;font-size:18px}
  .sheet p{color:var(--muted);font-size:13px;line-height:1.5}
  .sheet label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
  .sheet a{color:#60a5fa}
  .spin{display:inline-block;width:24px;height:24px;border:3px solid var(--card2);border-top-color:var(--blue);border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
 <div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="logo">⛽</div>
      <div>
        <h1>Bayazit Tanken</h1>
        <div class="loc" id="locText">Standort wird ermittelt …</div>
      </div>
    </div>
    <div style="display:flex;gap:6px">
      <button class="iconbtn" id="btnRefresh" title="Aktualisieren">⟳</button>
      <button class="iconbtn" id="btnSettings" title="Einstellungen">⚙️</button>
    </div>
  </div>
  <div class="seg" id="fuelSeg">
    <button data-f="diesel">Diesel</button>
    <button data-f="e5">Super E5</button>
    <button data-f="e10">Super E10</button>
  </div>
  <div class="row">
    <select id="radius">
      <option value="2">2 km</option>
      <option value="5">5 km</option>
      <option value="10">10 km</option>
      <option value="15">15 km</option>
      <option value="25">25 km</option>
      <option value="35">35 km</option>
      <option value="50">50 km</option>
    </select>
    <select id="sort">
      <option value="price">Nach Preis</option>
      <option value="dist">Nach Entfernung</option>
    </select>
    <select id="filter">
      <option value="open">Nur geöffnet</option>
      <option value="all">Alle</option>
      <option value="fav">Favoriten</option>
    </select>
  </div>
 </div>
</header>

<main class="wrap">
  <div id="summary" class="summary" style="display:none"></div>
  <div id="count" class="count"></div>
  <div id="list"></div>
  <footer>
    Preise: Markttransparenzstelle für Kraftstoffe (MTS-K) über
    <a href="https://creativecommons.tankerkoenig.de" target="_blank" rel="noopener">Tankerkönig</a> (CC BY 4.0).<br>
    Alle Angaben ohne Gewähr. <span id="stamp"></span>
  </footer>
</main>

<div class="overlay" id="ov">
  <div class="sheet">
    <h2>⚙️ Einstellungen</h2>
    <label for="keyIn">Tankerkönig-Schlüssel (API-Key)</label>
    <input id="keyIn" placeholder="z. B. 12345678-abcd-…" autocomplete="off">
    <p>Den kostenlosen Schlüssel bekommst du hier:
      <a href="https://onboarding.tankerkoenig.de/" target="_blank" rel="noopener">onboarding.tankerkoenig.de</a>.
      Er wird nur auf diesem Gerät gespeichert.</p>
    <label for="placeIn">Ort oder PLZ statt GPS (leer = GPS)</label>
    <input id="placeIn" placeholder="z. B. 84051 Essenbach">
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
      <button class="btn" id="saveBtn">Speichern</button>
      <button class="btn grey" id="gpsBtn">📍 GPS nutzen</button>
      <button class="btn grey" id="closeBtn">Schließen</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const API = "https://creativecommons.tankerkoenig.de/json/list.php";
  const GEO = "https://nominatim.openstreetmap.org/search";
  const DEFAULT = {lat:48.7176, lng:12.2058, name:"Ergoldsbach (Standard)"};
  const FUEL_NAME = {diesel:"Diesel", e5:"Super E5", e10:"Super E10"};
  const MAX_RAD = 25; // Tankerkönig erlaubt höchstens 25 km pro Abfrage

  const store = {
    get(k,d){ try{ const v=localStorage.getItem("tanken_"+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
    set(k,v){ try{ localStorage.setItem("tanken_"+k, JSON.stringify(v)); }catch(e){} }
  };

  const state = {
    key: store.get("key",""), fuel: store.get("fuel","diesel"), radius: store.get("radius","10"),
    sort: store.get("sort","price"), filter: store.get("filter","open"), place: store.get("place",""),
    favs: store.get("favs",[]), pos: null, stations: [], lastLoad: 0, loadedRadius: null, busy:false
  };

  const $ = id => document.getElementById(id);
  const list = $("list");

  function initControls(){
    document.querySelectorAll("#fuelSeg button").forEach(b=>{
      b.classList.toggle("on", b.dataset.f===state.fuel);
      b.onclick = ()=>{ state.fuel=b.dataset.f; store.set("fuel",state.fuel);
        document.querySelectorAll("#fuelSeg button").forEach(x=>x.classList.toggle("on",x===b)); render(); };
    });
    if(![...$("radius").options].some(o=>o.value===state.radius)) state.radius="10";
    $("radius").value = state.radius; $("sort").value = state.sort; $("filter").value = state.filter;
    $("radius").onchange = e=>{ state.radius=e.target.value; store.set("radius",state.radius); load(true); };
    $("sort").onchange = e=>{ state.sort=e.target.value; store.set("sort",state.sort); render(); };
    $("filter").onchange = e=>{ state.filter=e.target.value; store.set("filter",state.filter); render(); };
    $("btnRefresh").onclick = ()=> start(true);
    $("btnSettings").onclick = openSettings;
    $("closeBtn").onclick = ()=> $("ov").classList.remove("show");
    $("saveBtn").onclick = saveSettings;
    $("gpsBtn").onclick = ()=>{ $("placeIn").value=""; saveSettings(); };
    $("ov").onclick = e=>{ if(e.target.id==="ov") $("ov").classList.remove("show"); };
  }
  function openSettings(){ $("keyIn").value=state.key; $("placeIn").value=state.place; $("ov").classList.add("show"); }
  function saveSettings(){
    state.key=$("keyIn").value.trim(); state.place=$("placeIn").value.trim();
    store.set("key",state.key); store.set("place",state.place);
    $("ov").classList.remove("show"); start(true);
  }

  // ---------- Standort ----------
  function getGPS(){
    return new Promise((res,rej)=>{
      if(!navigator.geolocation) return rej(new Error("kein GPS"));
      navigator.geolocation.getCurrentPosition(
        p=>res({lat:p.coords.latitude, lng:p.coords.longitude, name:"Mein Standort"}),
        e=>rej(e), {enableHighAccuracy:false, timeout:12000, maximumAge:120000});
    });
  }
  async function geocode(q){
    const r = await fetch(GEO+"?format=json&limit=1&countrycodes=de&q="+encodeURIComponent(q), {headers:{"Accept-Language":"de"}});
    const j = await r.json();
    if(!j.length) throw new Error("Ort nicht gefunden");
    return {lat:+j[0].lat, lng:+j[0].lon, name:j[0].display_name.split(",").slice(0,2).join(",")};
  }
  async function locate(){
    if(state.place){
      try{ return await geocode(state.place); }
      catch(e){ showMsg("Der Ort <b>"+esc(state.place)+"</b> wurde nicht gefunden. Bitte in den Einstellungen prüfen."); throw e; }
    }
    try{ return await getGPS(); } catch(e){ return Object.assign({}, DEFAULT, {fallback:true}); }
  }

  // ---------- Geometrie ----------
  function distKm(a,b,c,d){
    const R=6371, toR=x=>x*Math.PI/180;
    const dLat=toR(c-a), dLng=toR(d-b);
    const h=Math.sin(dLat/2)**2+Math.cos(toR(a))*Math.cos(toR(c))*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(h));
  }
  function offset(lat,lng,dxKm,dyKm){
    return {lat: lat + dyKm/111.32, lng: lng + dxKm/(111.32*Math.cos(lat*Math.PI/180))};
  }
  // Abfragepunkte: bis 25 km eine Abfrage, darüber ein Raster aus 25-km-Kreisen
  function queryPoints(rad){
    const p = state.pos;
    if(rad<=MAX_RAD) return [{lat:p.lat,lng:p.lng,rad:rad}];
    const steps = rad<=35 ? [-17.5,17.5] : [-35,0,35];
    const pts=[];
    steps.forEach(dx=>steps.forEach(dy=>{ const o=offset(p.lat,p.lng,dx,dy); pts.push({lat:o.lat,lng:o.lng,rad:MAX_RAD}); }));
    return pts;
  }

  // ---------- Daten laden ----------
  async function start(force){
    if(!state.key){ showWelcome(); return; }
    showLoading("Standort wird ermittelt …");
    try{ state.pos = await locate(); }catch(e){ return; }
    $("locText").textContent = "📍 " + state.pos.name + (state.pos.fallback ? " – GPS nicht erlaubt" : "");
    load(force);
  }

  async function fetchOne(pt){
    const url = API+"?lat="+pt.lat.toFixed(5)+"&lng="+pt.lng.toFixed(5)+"&rad="+pt.rad+"&sort=dist&type=all&apikey="+encodeURIComponent(state.key);
    const r = await fetch(url); const j = await r.json();
    if(!j.ok) throw Object.assign(new Error(j.message||"unbekannt"),{api:true});
    return j.stations||[];
  }
  const sleep = ms=>new Promise(r=>setTimeout(r,ms));

  async function load(force){
    if(!state.key || !state.pos || state.busy) return;
    const rad = +state.radius;
    // Tankerkönig bittet: nicht öfter als alle 5 Minuten abfragen
    if(!force && state.loadedRadius===rad && Date.now()-state.lastLoad < 5*60*1000 && state.stations.length){ render(); return; }
    state.busy=true; $("btnRefresh").classList.add("spinning");
    const pts = queryPoints(rad);
    showLoading(pts.length>1 ? "Preise werden geladen …" : "Preise werden geladen …", pts.length>1 ? 0 : null);
    try{
      const map = new Map();
      for(let i=0;i<pts.length;i++){
        const st = await fetchOne(pts[i]);
        st.forEach(s=>map.set(s.id,s));
        if(pts.length>1){ setProgress((i+1)/pts.length); if(i<pts.length-1) await sleep(250); }
      }
      const p = state.pos;
      state.stations = [...map.values()].map(s=>{
        s.dist = Math.round(distKm(p.lat,p.lng,s.lat,s.lng)*10)/10; return s;
      }).filter(s=>s.dist<=rad);
      state.lastLoad = Date.now(); state.loadedRadius = rad;
      $("stamp").textContent = "Stand: " + new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}) + " Uhr";
      render();
    }catch(e){
      if(e.api){
        showMsg("Fehler von Tankerkönig: <b>"+esc(e.message)+"</b><br>Ist der Schlüssel richtig?",
          '<button class="btn" id="openSet">Einstellungen öffnen</button>');
        const b=$("openSet"); if(b) b.onclick=openSettings;
      } else {
        showMsg("Die Preise konnten nicht geladen werden. Bitte Internetverbindung prüfen.",
          '<button class="btn" id="retry">Nochmal versuchen</button>');
        const b=$("retry"); if(b) b.onclick=()=>load(true);
      }
    }finally{ state.busy=false; $("btnRefresh").classList.remove("spinning"); }
  }

  // ---------- Anzeige ----------
  const hasP = (s,f)=> typeof s[f]==="number" && s[f]>0;
  const eur = p => p.toFixed(3).replace(".",",")+" €";
  function fmtPrice(p){
    if(typeof p!=="number" || p<=0) return '<span>–</span>';
    const s = p.toFixed(3).replace(".",",");
    return s.slice(0,-1)+"<sup>"+s.slice(-1)+"</sup>";
  }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function title(s){ return String(s||"").trim().toLowerCase().replace(/(^|[\s\-\/(])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()); }

  function render(){
    const f = state.fuel;
    let arr = state.stations.slice();
    if(state.filter==="open") arr = arr.filter(s=>s.isOpen);
    if(state.filter==="fav") arr = arr.filter(s=>state.favs.includes(s.id));

    if(state.sort==="price"){
      // geöffnete zuerst, dann nach Preis
      arr.sort((a,b)=> (b.isOpen-a.isOpen) || ((hasP(a,f)?a[f]:99)-(hasP(b,f)?b[f]:99)) || a.dist-b.dist);
    } else arr.sort((a,b)=>a.dist-b.dist);

    // Kennzahlen nur aus geöffneten Tankstellen
    const open = arr.filter(s=>s.isOpen && hasP(s,f));
    const base = open.length ? open : arr.filter(s=>hasP(s,f));
    const prices = base.map(s=>s[f]);
    const min = prices.length?Math.min(...prices):0, max = prices.length?Math.max(...prices):0;
    const avg = prices.length?prices.reduce((a,b)=>a+b,0)/prices.length:0;

    const sum = $("summary");
    if(prices.length){
      sum.style.display="grid";
      sum.innerHTML =
        '<div class="sbox"><small>GÜNSTIGSTER</small><b style="color:#4ade80">'+eur(min)+'</b></div>'+
        '<div class="sbox"><small>DURCHSCHNITT</small><b>'+eur(avg)+'</b></div>'+
        '<div class="sbox"><small>TEUERSTER</small><b style="color:#f87171">'+eur(max)+'</b></div>';
    } else sum.style.display="none";

    if(!arr.length){
      $("count").textContent="";
      const t = state.filter==="fav" ? "Noch keine Favoriten. Tippe bei einer Tankstelle auf den ☆ Stern."
              : "Keine Tankstelle im Umkreis von "+state.radius+" km gefunden. Vergrößere den Umkreis.";
      list.innerHTML = '<div class="msg">'+t+'</div>'; return;
    }
    const nOpen = arr.filter(s=>s.isOpen).length;
    $("count").textContent = arr.length+" Tankstellen im Umkreis von "+state.radius+" km · "+nOpen+" geöffnet";

    list.innerHTML = arr.map((s,i)=>{
      const p = s[f], has = hasP(s,f);
      let cls="p-none";
      if(has){ const span=max-min; const r= span>0?(p-min)/span:0; cls = r<0.34?"p-good":r<0.67?"p-mid":"p-bad"; }
      const best = has && s.isOpen && p===min;
      const diff = has && s.isOpen && !best && min ? Math.round((p-min)*100) : 0;
      const fav = state.favs.includes(s.id);
      const others = ["diesel","e5","e10"].filter(x=>x!==f)
        .map(x=>FUEL_NAME[x]+": "+(hasP(s,x)? eur(s[x]):"–")).join(" · ");
      const nav = "https://www.google.com/maps/dir/?api=1&destination="+s.lat+","+s.lng;
      const brand = s.brand ? title(s.brand) : title(s.name);
      const addr = [title(s.street)+(s.houseNumber?" "+String(s.houseNumber).trim():""), title(s.place)].filter(Boolean).join(", ");
      return '<div class="st'+(best?" best":"")+(s.isOpen?"":" closed")+'" style="animation-delay:'+Math.min(i,12)*30+'ms">'+
        '<div class="price '+cls+'">'+fmtPrice(p)+'</div>'+
        '<div class="info">'+
          '<div class="name">'+esc(brand)+'</div>'+
          '<div class="addr">'+esc(addr)+'</div>'+
          '<div class="meta">'+
            (best?'<span class="tag best">Am günstigsten</span>':'')+
            (diff>0?'<span class="tag diff">+'+diff+' ct</span>':'')+
            '<span class="tag">'+String(s.dist).replace(".",",")+' km</span>'+
            '<span class="tag '+(s.isOpen?"open":"zu")+'">'+(s.isOpen?"geöffnet":"geschlossen")+'</span>'+
          '</div>'+
          '<div class="others">'+others+'</div>'+
        '</div>'+
        '<div class="nav">'+
          '<a href="'+nav+'" target="_blank" rel="noopener" title="Route">🧭</a>'+
          '<button class="fav" data-id="'+esc(s.id)+'" title="Favorit">'+(fav?"★":"☆")+'</button>'+
        '</div>'+
      '</div>';
    }).join("");

    list.querySelectorAll("button.fav").forEach(b=>{
      b.onclick = ()=>{
        const id=b.dataset.id; const i=state.favs.indexOf(id);
        if(i>=0) state.favs.splice(i,1); else state.favs.push(id);
        store.set("favs",state.favs); render();
      };
    });
  }

  function showLoading(t, progress){
    $("count").textContent="";
    list.innerHTML='<div class="msg"><div class="spin"></div><br>'+t+
      (progress!=null?'<div class="bar"><i id="prog" style="width:0%"></i></div>':'')+'</div>';
  }
  function setProgress(x){ const el=$("prog"); if(el) el.style.width=Math.round(x*100)+"%"; }
  function showMsg(html, extra){ $("summary").style.display="none"; $("count").textContent=""; list.innerHTML='<div class="msg">'+html+(extra?"<br>"+extra:"")+'</div>'; }
  function showWelcome(){
    $("locText").textContent = "Noch nicht eingerichtet";
    showMsg("<b>Willkommen!</b><br>Für die Live-Preise brauchst du einmalig einen kostenlosen Schlüssel von Tankerkönig.<br>"+
      "1. Schlüssel holen<br>2. Hier auf ⚙️ tippen und einfügen",
      '<a class="btn" href="https://onboarding.tankerkoenig.de/" target="_blank" rel="noopener">Schlüssel holen</a> '+
      '<button class="btn grey" id="w2">Schlüssel eingeben</button>');
    const b=$("w2"); if(b) b.onclick=openSettings;
  }

  setInterval(()=>{ if(document.visibilityState==="visible") load(false); }, 5*60*1000+2000);
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") load(false); });

  initControls();
  start(false);
})();
</script>
</body>
</html>
